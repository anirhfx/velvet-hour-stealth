<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velvet Hour — a stealth game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e14;
        overflow: hidden;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720"></canvas>
    <p id="status" class="sr-only" aria-live="polite"></p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
